<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
     
<title>Document</title>

<body>
<p id="t">0</p>
<button onclick="s()">Start</button>
<button onclick="x()">Stop</button>
<button onclick="r()">Reset</button>

<script>
let i, c = 0;
function s() {
  if (!i) i = setInterval(() => {
    t.innerText = ++c;
  }, 1000);
}
function x() {
  clearInterval(i);
  i = null;
}
function r() {
  x();
  c = 0;
  t.innerText = 0;
}
</script>



 </body>

 </html>
